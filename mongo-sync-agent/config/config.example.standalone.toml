# mongo-sync-agent configuration
#
# Profile: self-managed, standalone mongod
# ------------------------------------------
# Use this profile when Alteryx Server's MongoDB is NOT the embedded instance
# that ships with the Alteryx Service (i.e. you run/manage your own mongod,
# replica set, or Atlas cluster and pointed AlteryxService at it).
#
# Only the [mongo] section differs from the embedded-Alteryx profile; every
# other section below is identical between the two example files.

[agent]
# Local SQLite state DB tracking watermarks / file offsets / run history.
state_db = "C:/ProgramData/mongo-sync-agent/state.db"
# Scratch directory where Parquet files are staged before upload to S3.
spool_dir = "C:/ProgramData/mongo-sync-agent/spool"
# Directory for this agent's own log output.
log_dir = "C:/ProgramData/mongo-sync-agent/logs"

[mongo]
enabled = true
database = "AlteryxService"

# Connect using discrete host/port/auth fields. If you would rather supply a
# single connection string, set `uri = "mongodb://..."` instead and remove
# host/port/username/password/auth_source/tls/tls_ca_file below — `uri`
# always takes priority over the discrete fields when both are present.
host = "mongo01.internal.example.com"
port = 27017
username = "alteryx_reader"
password = "CHANGE_ME"
auth_source = "admin"

# Enable TLS if your mongod / replica set requires encrypted connections.
tls = false
# tls_ca_file = "C:/ProgramData/mongo-sync-agent/certs/mongo-ca.pem"

server_selection_timeout_ms = 5000

# One [[mongo.collections]] block per collection to sync.
#
# mode:
#   append_only  - rows are only ever inserted (e.g. queue/history logs);
#                  the agent tracks progress by _id / insertion order.
#   mutable      - rows can be updated after insert; requires
#                  `watermark_field` (a field that changes on every update,
#                  e.g. "dtModified") so the agent can re-pull changed rows.
#   full_refresh - the whole collection is re-read and re-uploaded each run;
#                  use for small reference/config collections only.
[[mongo.collections]]
name = "AS_Queue"
mode = "append_only"
overlap_seconds = 30
batch_size = 1000

[[mongo.collections]]
name = "AS_Jobs"
mode = "mutable"
watermark_field = "dtModified"
overlap_seconds = 60
batch_size = 1000

[s3]
bucket = "my-alteryx-mongo-sync-bucket"
region = "eu-west-2"
prefix = ""

[logs]
enabled = true
gc_days = 14

[[logs.sources]]
name = "gallery"
path_glob = "C:/ProgramData/Alteryx/Gallery/Logs/alteryx-*.csv"
encoding = "utf-16-le"

[[logs.sources]]
name = "service"
path_glob = "C:/ProgramData/Alteryx/Service/AlteryxServiceLog_*.log"
encoding = "utf-8"

[hostmetrics]
enabled = true
disks = ["C:", "D:"]
