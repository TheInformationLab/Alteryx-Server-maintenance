[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "mongo-sync-agent"
# Version is single-sourced from src/mongo_sync_agent/_version.py (which the
# release pipeline stamps from the git tag), so packaging metadata and
# `msa --version` never drift.
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.7",
    "pyarrow>=16.0",
    "boto3>=1.34",
    "psutil>=6.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14"]

[project.scripts]
msa = "mongo_sync_agent.cli:main"

[tool.setuptools.dynamic]
version = {attr = "mongo_sync_agent._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
